services:
  postgres:
    image: postgres:15-alpine
    container_name: cafeteria-postgres
    restart: always
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./BaseDeDatos/cafeteria-postgres.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./BaseDeDatos/init-schemas.sql:/docker-entrypoint-initdb.d/02-schemas.sql
      - postgres-data:/var/lib/postgresql/data
    networks:
      - cafeteria-net

  redis:
    image: redis:7-alpine
    container_name: cafeteria-redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - cafeteria-net

  user-service:
    build:
      context: .
      dockerfile: ./services/user-service/Dockerfile
    container_name: cafeteria-user-service
    restart: always
    ports:
      - "3002:3002"
    depends_on:
      - postgres
    environment:
      - PORT=3002
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=development
    networks:
      - cafeteria-net

  catalog-service:
    build:
      context: .
      dockerfile: ./services/catalog-service/Dockerfile
    container_name: cafeteria-catalog-service
    restart: always
    ports:
      - "3003:3003"
    depends_on:
      - postgres
    environment:
      - PORT=3003
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379
    networks:
      - cafeteria-net

  api-gateway:
    build:
      context: .
      dockerfile: ./services/api-gateway/Dockerfile
    container_name: cafeteria-api-gateway
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - user-service
      - catalog-service
      - legacy-monolith
    environment:
      - PORT=3000
      - USER_SERVICE_URL=http://user-service:3002
      - CATALOG_SERVICE_URL=http://catalog-service:3003
      - LEGACY_MONOLITH_URL=http://legacy-monolith:3001
      - JWT_SECRET=${JWT_SECRET}
    networks:
      - cafeteria-net

  legacy-monolith:
    build:
      context: .
      dockerfile: ./services/legacy-monolith/Dockerfile
    container_name: cafeteria-legacy-monolith
    restart: always
    ports:
      - "3001:3001"
    depends_on:
      - postgres
      - redis
      - user-service
      - catalog-service
    environment:
      - PORT=3001
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379
      - USER_SERVICE_URL=http://user-service:3002
      - CATALOG_SERVICE_URL=http://catalog-service:3003
    networks:
      - cafeteria-net

volumes:
  postgres-data:

networks:
  cafeteria-net:
    driver: bridge
