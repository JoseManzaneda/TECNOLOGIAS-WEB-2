version: "3.9"

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - cafeteria-net

  auth-db:
    image: mysql:8.0
    container_name: auth-db
    command: ["--default-authentication-plugin=mysql_native_password"]
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: auth_db
    ports:
      - "3307:3306"
    volumes:
      - auth-db-data:/var/lib/mysql
      - ./microservices/database/auth.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - cafeteria-net

  users-db:
    image: mysql:8.0
    container_name: users-db
    command: ["--default-authentication-plugin=mysql_native_password"]
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: users_db
    ports:
      - "3308:3306"
    volumes:
      - users-db-data:/var/lib/mysql
      - ./microservices/database/users.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - cafeteria-net

  products-db:
    image: mysql:8.0
    container_name: products-db
    command: ["--default-authentication-plugin=mysql_native_password"]
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: products_db
    ports:
      - "3309:3306"
    volumes:
      - products-db-data:/var/lib/mysql
      - ./microservices/database/products.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - cafeteria-net

  auth-service:
    build:
      context: ./microservices/auth-service
    container_name: auth-service
    depends_on:
      - auth-db
      - rabbitmq
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: auth-db
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: root
      DB_DATABASE: auth_db
      JWT_SECRET: cafeteria_secret_key_super_secure_2025
      JWT_EXPIRATION: 1h
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      RABBITMQ_QUEUE: auth_queue
      RABBITMQ_EXCHANGE: cafeteria.events
      USERS_SERVICE_URL: http://users-service:3002
      PRODUCTS_SERVICE_URL: http://products-service:3003
    ports:
      - "3001:3001"
    networks:
      - cafeteria-net

  users-service:
    build:
      context: ./microservices/users-service
    container_name: users-service
    depends_on:
      - users-db
      - rabbitmq
    environment:
      NODE_ENV: production
      PORT: 3002
      DB_HOST: users-db
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: root
      DB_DATABASE: users_db
      JWT_SECRET: cafeteria_secret_key_super_secure_2025
      JWT_EXPIRATION: 1h
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      RABBITMQ_QUEUE: auth_queue
      RABBITMQ_EXCHANGE: cafeteria.events
    ports:
      - "3002:3002"
    networks:
      - cafeteria-net

  products-service:
    build:
      context: ./microservices/products-service
    container_name: products-service
    depends_on:
      - products-db
      - rabbitmq
    environment:
      NODE_ENV: production
      PORT: 3003
      DB_HOST: products-db
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: root
      DB_DATABASE: products_db
      JWT_SECRET: cafeteria_secret_key_super_secure_2025
      JWT_EXPIRATION: 1h
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      RABBITMQ_QUEUE: products_queue
      RABBITMQ_EXCHANGE: cafeteria.events
    ports:
      - "3003:3003"
    networks:
      - cafeteria-net

  api-gateway:
    build:
      context: ./microservices/api-gateway
    container_name: api-gateway
    depends_on:
      - auth-service
      - users-service
      - products-service
    environment:
      NODE_ENV: production
      PORT: 3000
      API_PREFIX: /api
      AUTH_SERVICE_URL: http://auth-service:3001
      USERS_SERVICE_URL: http://users-service:3002
      PRODUCTS_SERVICE_URL: http://products-service:3003
    ports:
      - "3000:3000"
    networks:
      - cafeteria-net

volumes:
  auth-db-data:
  users-db-data:
  products-db-data:

networks:
  cafeteria-net:
    driver: bridge
