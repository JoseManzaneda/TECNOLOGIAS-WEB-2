version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: cafeteria-postgres
    restart: always
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./BaseDeDatos/cafeteria-postgres.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres-data:/var/lib/postgresql/data
    networks:
      - cafeteria-net

  redis:
    image: redis:7-alpine
    container_name: cafeteria-redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - cafeteria-net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cafeteria-api
    restart: always
    ports:
      - "${APP_PORT}:${APP_PORT}"
    depends_on:
      - postgres
      - redis
    env_file:
      - .env
    networks:
      - cafeteria-net

volumes:
  postgres-data:

networks:
  cafeteria-net:
    driver: bridge
