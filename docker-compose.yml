version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: cafeteria-postgres
    restart: always
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./BaseDeDatos/cafeteria-postgres.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres-data:/var/lib/postgresql/data
    networks:
      - cafeteria-net

  redis:
    image: redis:7-alpine
    container_name: cafeteria-redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - cafeteria-net

  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: cafeteria-api-gateway
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - legacy-monolith
    environment:
      - PORT=3000
      - LEGACY_MONOLITH_URL=http://legacy-monolith:3001
      - JWT_SECRET=${JWT_SECRET}
    networks:
      - cafeteria-net

  legacy-monolith:
    build:
      context: ./services/legacy-monolith
      dockerfile: Dockerfile
    container_name: cafeteria-legacy-monolith
    restart: always
    ports:
      - "3001:3001"
    depends_on:
      - postgres
      - redis
    environment:
      - PORT=3001
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    networks:
      - cafeteria-net

volumes:
  postgres-data:

networks:
  cafeteria-net:
    driver: bridge
